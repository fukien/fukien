name: Update commit stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - main
      - master
    paths:
      - README.md
      - scripts/update_commit_stats.py
      - .github/workflows/update-commit-stats.yml

permissions:
  contents: write

jobs:
  update-commit-stats:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update yearly commit counts
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_commit_stats.py --username fukien

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "Commit count is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GitHub commit stats"
          git push
