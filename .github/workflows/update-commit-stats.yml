name: Update GitHub stats card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_commit_stats.py
      - .github/workflows/update-commit-stats.yml

permissions:
  contents: write

jobs:
  update-stats-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh public GitHub stats image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_commit_stats.py --username fukien

      - name: Commit refreshed image
        run: |
          if git diff --quiet -- README.md assets/github-stats.svg; then
            echo "The stats image is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          git commit -m "Update public GitHub stats card"
          git push
