<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">Wentao Huang's GitHub Stats</title>
  <desc id="desc">Rank A+. Total stars earned: 62. Public commits: 508. Total pull requests: 7. Total issues: 18. Contributed to last year: 0.</desc>
  <style>
    .bg { fill: #1a1b27; stroke: #e4e2e2; }
    .title { fill: #70a5fd; font: 600 18px 'Segoe UI', Ubuntu, sans-serif; }
    .label, .value { fill: #38bdae; font: 600 13px 'Segoe UI', Ubuntu, sans-serif; }
    .value { font-weight: 700; }
    .rank-rim { fill: none; stroke: #70a5fd; stroke-width: 6; opacity: .2; }
    .rank { fill: #38bdae; font: 800 27px 'Segoe UI', Ubuntu, sans-serif; }
    .rank-caption { fill: #a9b1d6; font: 11px 'Segoe UI', Ubuntu, sans-serif; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="494" height="194" rx="4.5" />
  <text class="title" x="25" y="35">Wentao Huang's GitHub Stats</text>
  <g transform="translate(25,66)">
    <text class="label" x="0" y="0">Total Stars Earned</text>
    <text class="value" x="250" y="0">62</text>
  </g>
  <g transform="translate(25,89)">
    <text class="label" x="0" y="0">Public Commits</text>
    <text class="value" x="250" y="0">508</text>
  </g>
  <g transform="translate(25,112)">
    <text class="label" x="0" y="0">Total Pull Requests</text>
    <text class="value" x="250" y="0">7</text>
  </g>
  <g transform="translate(25,135)">
    <text class="label" x="0" y="0">Total Issues</text>
    <text class="value" x="250" y="0">18</text>
  </g>
  <g transform="translate(25,158)">
    <text class="label" x="0" y="0">Contributed to (last year)</text>
    <text class="value" x="250" y="0">0</text>
  </g>
  <circle class="rank-rim" cx="420" cy="112" r="38" />
  <text class="rank" x="420" y="121" text-anchor="middle">A+</text>
  <text class="rank-caption" x="420" y="160" text-anchor="middle">rank</text>
</svg>
